<script>
const app=document.getElementById('app');
const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const unb64=s=>{try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return null}};
const qs=new URLSearchParams(location.search);
const hash=location.hash;
const qsurprise=qs.get('surprise');
const qanswers=qs.get('answers');
let received=hash.startsWith('#surprise=')?unb64(hash.slice(10)):(qsurprise?unb64(qsurprise):null);
let answerPacket=hash.startsWith('#answers=')?unb64(hash.slice(9)):(qanswers?unb64(qanswers):null);
let data={name:'',senderName:'',rel:'',messages:'',reasons:'',favorite:'',secret:'',photos:[],question:'',questions:[],voice:''};

function home(){app.innerHTML=`<div class="card"><div class="garden">🌷 ✨ 🌸 ✨ 🌷</div><div class="script">Some feelings deserve more than a message. ♡</div><p class="sub">Turn the words you keep inside into a little love story — personal, beautiful, and made for someone special.</p><button onclick="start()">Begin Something Beautiful ❤️</button><p class="small">Made with little pieces of love, stars & flowers ✦</p></div>`}
function start(){step(1)}
const steps=[
['Who is this little love story for?','Start with the person who makes your heart feel a little fuller.'],
['What have you been wanting to say?','Write the words you usually keep inside. Take your time.'],
['Why do you love them?','Something tiny, something beautiful, or something only you understand.'],
['Why are they your favorite person?','Tell them what makes their place in your heart so special.'],
['A little secret note','Leave them a private little thought, memory, promise, or confession.'],
['Some Special Memories for You','Choose a few photos that hold a special place in your story.'],
['A little voice from you','Say something they can hear in your own voice.'],
['Questions from your heart','Choose the little questions you want them to answer — and customize or add your own.']
];
function step(n){
 let [title,desc]=steps[n-1];
 let body='';
 if(n===1) body=`<div class="field"><label>Your name</label><input id="senderName" placeholder="Enter your name" value="${esc(data.senderName)}"></div><div class="field"><label>Their name</label><input id="name" placeholder="Enter their name" value="${esc(data.name)}"></div><div class="field"><label>Your relationship</label><div class="choices">${['Partner','Boyfriend','Girlfriend','Husband','Wife','Someone Special','Crush','Best Friend'].map(x=>`<button type="button" class="secondary ${data.rel===x?'sel':''}" onclick="data.rel='${x}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));this.classList.add('sel')">${x}</button>`).join('')}</div></div>`;
 if(n===2) body=`<div class="field"><textarea id="messages" maxlength="1000" placeholder="Write what your heart wants to say...">${esc(data.messages)}</textarea></div>`;
 if(n===3) body=`<div class="field"><textarea id="reasons" placeholder="Tell them why you love them...">${esc(data.reasons)}</textarea></div>`;
 if(n===4) body=`<div class="field"><textarea id="favorite" placeholder="Why are they your favorite person?">${esc(data.favorite)}</textarea></div>`;
 if(n===5) body=`<div class="field"><textarea id="secret" placeholder="A promise, a secret, a memory...">${esc(data.secret)}</textarea></div>`;
 if(n===6) body=`<div class="field"><input id="photos" type="file" accept="image/*" multiple><p class="small">You can choose a few special memories. They will appear one by one inside the surprise. 🌸</p></div>`;
 if(n===7) body=`<div class="voice-panel"><div class="script" style="font-size:32px">A Little Voice From You 🎙️💗</div><p class="sub">Say something they can hear in your own voice. Keep it short and sweet. ♡</p><button type="button" id="recordBtn" onclick="toggleRecording()">🎙️ Start Recording</button><div id="voiceStatus" class="voice-status">${data.voice?'A voice message is ready ♡':'Nothing recorded yet'}</div><audio id="voicePreview" controls class="${data.voice?'':'hidden'}" src="${data.voice||''}"></audio></div><p class="small">Next, you can choose the questions you want them to answer. 💌</p>`;
 if(n===8){const defaults=['What is one little thing about us that makes you smile? 💗','When you think of me, what is the first memory that comes to your heart? 🌸','What is something you want us to do together someday? ✨','What is one thing you want me to always remember about you? 💌','If our story had one more beautiful chapter, what would you want it to be? 🌷']; if(!data.questions.length)data.questions=defaults.map(q=>({text:q,enabled:true})); body=`<div id="questionList">${data.questions.map((q,i)=>`<div class="question-edit"><div class="field"><label>Question ${i+1}</label><textarea class="qinput" data-i="${i}">${esc(q.text)}</textarea><label class="checkline"><input type="checkbox" class="qcheck" data-i="${i}" ${q.enabled!==false?'checked':''}> Ask this question 💗</label></div></div>`).join('')}</div><div class="nav"><button type="button" class="secondary" onclick="addQuestion()">＋ Add Another Question</button></div><p class="small">You can edit every question, remove one by clearing it, or add as many as you like. The receiver will see only the questions you choose — never the sender-side form. ♡</p>`;}
 app.innerHTML=`<div class="card"><div class="progress"><i style="width:${n/8*100}%"></i></div><span class="pill">A little beginning · ${n} of 8</span><h2 class="script">${title}</h2><p class="sub">${desc}</p>${body}<div class="nav">${n>1?'<button class="secondary" onclick="saveStep();step('+(n-1)+')">Back</button>':''}<button onclick="${n===8?'validateSenderStep(8)&&finish()':'nextSenderStep('+n+')'}">${n===8?'Make Them Surprise 💗':'Keep going, love ♡'}</button></div></div>`;
}
function validateSenderStep(n){
 if(n===1){
  const sender=(document.getElementById('senderName')?.value||'').trim();
  const receiver=(document.getElementById('name')?.value||'').trim();
  if(!sender){alert('Please enter your name first. 💗');document.getElementById('senderName')?.focus();return false}
  if(!receiver){alert('Please enter their name first. 💗');document.getElementById('name')?.focus();return false}
  if(!data.rel){alert('Please choose your relationship first. 🌷');return false}
 }
 if(n===2 && !(document.getElementById('messages')?.value||'').trim()){alert('Write your little message before going on. 💌');document.getElementById('messages')?.focus();return false}
 if(n===3 && !(document.getElementById('reasons')?.value||'').trim()){alert('Tell them why you love them before going on. ❤️');document.getElementById('reasons')?.focus();return false}
 if(n===4 && !(document.getElementById('favorite')?.value||'').trim()){alert('Tell them what makes them your favorite person. 💗');document.getElementById('favorite')?.focus();return false}
 if(n===5 && !(document.getElementById('secret')?.value||'').trim()){alert('Write their little secret note before going on. 🤫');document.getElementById('secret')?.focus();return false}
 if(n===8){
  const chosen=[...document.querySelectorAll('.qinput')].map((el,i)=>({text:el.value.trim(),enabled:document.querySelector(`.qcheck[data-i="${i}"]`)?.checked!==false})).filter(q=>q.text&&q.enabled);
  if(!chosen.length){alert('Please choose at least one question for them to answer. 💌');return false}
 }
 return true;
}
function nextSenderStep(n){
 if(!validateSenderStep(n))return;
 saveStep();
 step(n+1);
}
function saveStep(){
 data.senderName=document.getElementById('senderName')?.value??data.senderName;
 data.name=document.getElementById('name')?.value??data.name;
 data.rel=data.rel||'';
 data.messages=document.getElementById('messages')?.value??data.messages;
 data.reasons=document.getElementById('reasons')?.value??data.reasons;
 data.favorite=document.getElementById('favorite')?.value??data.favorite;
 data.secret=document.getElementById('secret')?.value??data.secret;
 data.question=document.getElementById('question')?.value??data.question;
 const qins=[...document.querySelectorAll('.qinput')]; if(qins.length){data.questions=qins.map((el,i)=>({text:el.value.trim(),enabled:document.querySelector(`.qcheck[data-i=\"${i}\"]`)?.checked!==false})).filter(q=>q.text)};
 if(window.recordedVoice) data.voice=window.recordedVoice;
}
let mediaRecorder=null, voiceChunks=[];
async function toggleRecording(){
 const btn=document.getElementById('recordBtn'), status=document.getElementById('voiceStatus');
 if(mediaRecorder && mediaRecorder.state==='recording'){ mediaRecorder.stop(); btn.textContent='🎙️ Start Recording'; status.textContent='Saving your little voice… ♡'; return; }
 if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ alert('Voice recording is not supported in this browser. You can still use the rest of the surprise. 💗'); return; }
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  voiceChunks=[]; mediaRecorder=new MediaRecorder(stream,{audioBitsPerSecond:24000});
  mediaRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};
  mediaRecorder.onstop=()=>{
   stream.getTracks().forEach(x=>x.stop());
   const blob=new Blob(voiceChunks,{type:mediaRecorder.mimeType||'audio/webm'});
   const reader=new FileReader(); reader.onload=()=>{window.recordedVoice=reader.result; data.voice=reader.result; const a=document.getElementById('voicePreview'); if(a){a.src=reader.result;a.classList.remove('hidden')} const s=document.getElementById('voiceStatus'); if(s)s.textContent='Your voice message is ready ♡';}; reader.readAsDataURL(blob);
  };
  mediaRecorder.start(); btn.textContent='⏹️ Stop Recording'; status.textContent='Recording… speak from your heart 💗';
  setTimeout(()=>{if(mediaRecorder?.state==='recording')toggleRecording()},30000);
 }catch(e){ alert('Microphone permission is needed to record your voice. 💗'); }
}
function addQuestion(){const list=document.getElementById('questionList');if(!list)return;const i=list.querySelectorAll('.qinput').length;const wrap=document.createElement('div');wrap.className='question-edit';wrap.innerHTML=`<div class="field"><label>Question ${i+1}</label><textarea class="qinput" data-i="${i}" placeholder="Write your own little question… 💗"></textarea><label class="checkline"><input type="checkbox" class="qcheck" data-i="${i}" checked> Ask this question 💗</label></div>`;list.appendChild(wrap)}
async function finish(){
 saveStep();
 if(!data.questions.length && data.question) data.questions=[{text:data.question,enabled:true}];
 const files=document.getElementById('photos')?.files;
 if(files?.length){data.photos=[];for(const f of [...files].slice(0,6)){data.photos.push(await resize(f,900));}}
 const token=b64(data);
 const link=location.href.split('#')[0]+'#surprise='+token;
 app.innerHTML=`<div class="card"><div class="garden">🌹 ✨ 💌 ✨ 🌹</div><div class="script">Your little surprise is ready ♡</div><p class="sub">Send this link to <b>${esc(data.name||'someone special')}</b> from <b>${esc(data.senderName||'someone special')}</b>. They'll receive a completely different experience — no questions for them except the one you chose at the end.</p><textarea readonly id="share">${link}</textarea><div class="nav"><button type="button" class="secondary final-back-btn" onclick="goBackFromFinal()">← Back & Edit</button>
<button onclick="shareSurprise()">Share Your Surprise 💌</button><button class="secondary" onclick="location.href=location.href.split('#')[0]">Make Another</button></div><p class="small">For a real cross-device deployment, the link carries the surprise data inside it.</p></div>`;
}
function receiver(){app.innerHTML=`<div class="receiver-screen"><div class="receiver-card"><div id="receiverHome"><div class="receiver-decor">🌷 ✨ ♡ ✨ 🌷</div><div class="receiver-script">Hey <span class="receiver-name">${esc(received.name||'someone special')}</span>… ♡</div><p class="receiver-soft">Someone special has sent a little something just for you. 💗</p><p class="receiver-message" style="font-size:29px;margin:18px 0">There’s something waiting behind this little door…<br>made especially for you. ♡</p><div class="receiver-door-wrap"><div class="receiver-gate" id="receiverGate" onclick="openGate()"><div class="receiver-gate-frame"></div><div class="receiver-gate-door"></div></div></div><button class="receiver-open-btn" onclick="openGate()">Tap to Reveal the Name ✨</button></div><div id="receiverContent" class="receiver-content"></div></div></div>`}
function openGate(){const g=document.getElementById('receiverGate');if(!g)return;g.classList.add('open');setTimeout(()=>revealSender(),1000)}
function revealSender(){const box=document.getElementById('receiverContent'),home=document.getElementById('receiverHome');home.style.display='none';box.innerHTML=`<div class="receiver-step active"><div class="receiver-decor">💗 ✨ 🌸 ✨ 💗</div><div class="receiver-title">It’s <span class="receiver-name">${esc(received.senderName||'Someone Special')}</span>… ❤️</div><p class="receiver-soft">${esc(received.senderName||'Someone Special')} has sent you this little surprise. 💌</p><div class="receiver-letter"><div class="receiver-message">A little piece of my heart is waiting for you inside… just for you. ♡</div></div><button class="receiver-open-btn" onclick="showStep(0)">More surprises are waiting for you… 💗</button><button class="receiver-back" onclick="goHome()">← Go Back ♡</button></div>`}
function goHome(){location.hash='';location.reload()}
function items(){return [
 {kind:'message',title:'Some words are meant to be felt, not just read… 💌',text:received.messages,more:'Let Me Show You Another Little Feeling… 🌷'},
 {kind:'message',title:'A little corner of my heart… 💗',text:[received.reasons,received.favorite].filter(Boolean).join('\n\n'),more:'There’s One More Thing I Kept For You… ✨'},
 {kind:'message',title:'Psst… this one is just between we two 🤭',text:received.secret,more:'Keep This Little Secret Close… 💕'},
 {kind:'photos',title:'Memories, one little moment at a time… 📸',photos:Array.isArray(received.photos)?received.photos:[],more:'And Now… Listen to My Heart 🎙️'},
 {kind:'voice',title:'Close your eyes and hear my heart… 🎙️❤️',voice:received.voice,more:'Before You Go… I Have a Few Little Things to Ask 💌'}
]}
function showStep(i){stepIndex=i;const s=items()[i],box=document.getElementById('receiverContent');if(!box)return;box.innerHTML=`<div class="receiver-step active"><div class="receiver-decor">♡ ✦ 💗 ✦ ♡</div><div class="receiver-title">${s.title}</div>${s.kind==='message'?`<div class="receiver-letter"><div class="receiver-message">${esc(s.text||'A little feeling was saved here especially for you. ♡')}</div></div>`:''}${s.kind==='voice'?`<div class="receiver-letter"><div class="receiver-message">A little voice, saved especially for you. ❤️</div>${s.voice?`<audio controls style="width:100%;margin-top:15px" src="${s.voice}"></audio>`:`<p class="receiver-soft">My voice will be waiting here when they record one. ♡</p>`}</div>`:''}${s.kind==='photos'?`<div id="photoArea"></div>`:''}${s.kind!=='photos'?`<button class="receiver-more receiver-question-btn" onclick="nextStep()">${s.more}</button>`:''}<button class="receiver-back" onclick="backStep()">← Go Back & Read Again ♡</button></div>`;if(s.kind==='photos')renderPhoto(0)}
function nextStep(){if(stepIndex<items().length-1)showStep(stepIndex+1);else showQuestions()}
function backStep(){if(stepIndex>0)showStep(stepIndex-1);else revealSender()}
function renderPhoto(i){const s=items()[3],area=document.getElementById('photoArea');if(!area)return;if(!s.photos.length){area.innerHTML='<div class="receiver-letter"><div class="receiver-message">Some memories are felt, not just seen. ♡</div></div><button class="receiver-more receiver-question-btn" onclick="nextStep()">'+s.more+'</button>';return}const p=s.photos[i];area.innerHTML=`<div class="receiver-memory"><img src="${p}" alt="A special memory"><div class="receiver-soft" style="margin-top:12px">${i+1} of ${s.photos.length} · A memory wrapped in love ♡</div></div><button class="receiver-more receiver-question-btn" onclick="${i<s.photos.length-1?`renderPhoto(${i+1})`:'nextStep()'}">${i<s.photos.length-1?'Another little memory… 🌸':s.more}</button>`}
window.questionAnswers=[];window.receiverQuestions=(received?.questions||[]).filter(q=>q&&q.text&&q.enabled!==false);
function showQuestions(){const box=document.getElementById('receiverContent');if(!window.receiverQuestions.length){finishReceiver();return}box.innerHTML=`<div class="receiver-step active"><div class="receiver-decor">🌹 ✨ 💌 ✨ 🌹</div><div class="receiver-title">A Few Little Things From Your Heart… ♡</div><p class="receiver-soft">${esc(received.senderName||'Someone special')} left these little questions for you. Every answer is required, because every little answer matters. ❤️</p><div id="allQuestionAnswers"></div><button class="receiver-more send-heart" onclick="sendAllAnswers()">Send Your Heart ❤️</button><button class="receiver-back" onclick="backStep()">← Go Back & Read Again ♡</button></div>`;const list=document.getElementById('allQuestionAnswers');window.receiverQuestions.forEach((q,i)=>{const w=document.createElement('div');w.className='receiver-question-card';w.innerHTML=`<div class="receiver-soft" style="font-size:22px">Question ${i+1} 💌</div><div class="receiver-letter"><div class="receiver-question">${esc(q.text)}</div></div><div class="receiver-answer-label">Your little answer… ♡</div><textarea class="receiver-answer all-answer" data-i="${i}" required placeholder="Write your heart here… 💗"></textarea>`;list.appendChild(w)})}
function sendAllAnswers(){const fields=[...document.querySelectorAll('.all-answer')];const answers=window.receiverQuestions.map((q,i)=>({question:q.text,answer:(fields[i]?.value||'').trim()}));const missing=answers.findIndex(x=>!x.answer);if(missing>=0){alert(`Question ${missing+1} ka answer dena zaroori hai 💗`);fields[missing]?.focus();return}window.questionAnswers=answers.map(x=>x.answer);const packet={senderName:received.senderName||'Someone Special',receiverName:received.name||'Someone Special',questions:answers};window.finalAnswerLink=location.href.split('#')[0].split('?')[0]+'?answers='+encodeURIComponent(b64(packet));showAnswerReady()}
function showAnswerReady(){const box=document.getElementById('receiverContent');box.innerHTML=`<div class="receiver-step active"><div class="receiver-decor">💗 ✨ 🌸 ✨ 💗</div><div class="receiver-title">Your Heart Is Ready to Travel… ❤️</div><div class="receiver-letter"><div class="receiver-message">You answered every little question with your own heart. Now your reply is ready to go back to ${esc(received.senderName||'them')}. 💌</div></div><button class="receiver-open-btn send-heart" onclick="shareAnswer()">Send Your Heart ❤️</button><div class="answer-link-box"><div class="receiver-soft" style="font-size:21px">Your reply link</div><textarea readonly>${esc(window.finalAnswerLink)}</textarea></div><button class="receiver-back" onclick="showQuestions()">← Go Back & Edit Answers ♡</button></div>`}
async function shareAnswer(){const link=window.finalAnswerLink;if(navigator.share){try{await navigator.share({title:'A little reply ❤️',text:'I sent you my heart 💗',url:link});return}catch(e){}}try{await navigator.clipboard.writeText(link);alert('Your answer link is copied. Send it to them with love ❤️')}catch(e){prompt('Copy your answer link:',link)}}
function finishReceiver(){document.getElementById('receiverContent').innerHTML='<div class="receiver-step active"><div class="receiver-decor">💗 ✨ 🌸</div><div class="receiver-title">That was the last little question ♡</div><div class="receiver-letter"><div class="receiver-message">Thank you for opening every little piece of this surprise. You made the story even more beautiful. 🌷</div></div></div>'}
if(hash.startsWith('#answers=')||qs.get('answers')){
  const packet=hash.startsWith('#answers=')?unb64(hash.slice(9)):unb64(qs.get('answers'));
  if(packet){senderAnswer(packet)}else{home()}
}else if(hash.startsWith('#surprise=')||qsurprise){
  if(received){receiver()}else{home()}
}else{
  home();
}

function senderAnswer(packet){
const sender=packet?.senderName||"Someone special",receiver=packet?.receiverName||"someone special";const qs=Array.isArray(packet?.questions)?packet.questions:[];const safe=v=>esc(String(v??""));const cards=qs.map((x,i)=>`<div class="answer-return-card"><div class="answer-return-q">${i+1}. ${safe(x?.question??x?.q??"")}</div><div class="answer-return-a">${safe(x?.answer??x?.a??"").replace(/\n/g,"<br>")}</div></div>`).join("");app.innerHTML=`<div class="returned-page-shell"><div class="returned-page active" id="returned1"><div class="returned-card"><div class="returned-heart">❤️</div><h1>A little piece of your heart<br>has found its way back to you…</h1><p><strong>${safe(receiver)}</strong> has sent something back to <strong>${safe(sender)}</strong>… 💗</p><p class="returned-small">They took a little moment to put their feelings into words…<br>and now, these little pieces of their heart are yours to discover. 🌷✨</p><button class="returned-btn" onclick="returnedShow(2)">Tap to open their heart… ♡</button></div></div><div class="returned-page" id="returned2"><div class="returned-card"><div class="returned-heart">💌</div><h2>Here are the answers from ${safe(receiver)}’s heart…</h2>${cards||"<div class=\"answer-return-card\"><div class=\"answer-return-a\">This little heart is waiting for its answers… ❤️</div></div>"}<div class="returned-nav"><button class="returned-btn secondary" onclick="returnedShow(1)">← Back</button><button class="returned-btn" onclick="returnedShow(3)">One last little thing… ♡</button></div></div></div><div class="returned-page" id="returned3"><div class="returned-card"><div class="returned-heart">🌷</div><h2 class="returned-ending">Happy Ending… for now ❤️</h2><p><strong>${safe(sender)}</strong> & <strong>${safe(receiver)}</strong> — your little story continues. 🌸</p><p>Because some stories don't really end…<br>they simply become another beautiful memory for ${safe(sender)} & ${safe(receiver)}. ✨</p><p>And maybe this little answer was just another way of saying…<br><strong>“I'm glad it's you.” ❤️</strong></p><button class="returned-btn secondary" onclick="returnedShow(2)">← Read the answers again</button></div></div></div>`;}
function returnedShow(n){document.querySelectorAll(".returned-page").forEach(x=>x.classList.remove("active"));const t=document.getElementById("returned"+n);if(t)t.classList.add("active");window.scrollTo(0,0)}

function openAnswerDoubleDoor(){
 const d=document.getElementById('answerDoubleDoor');
 if(d){d.classList.add('open');}
 setTimeout(()=>{const x=document.getElementById('answerInside');if(x)x.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})},900);
}
function openAnswerDoor(){openAnswerDoubleDoor()}
async function shareSurprise(){
 const link=document.getElementById('share').value;
 if(navigator.share){try{await navigator.share({title:'A little surprise for you ❤️',text:'Someone made a little surprise just for you 💌',url:link});return}catch(e){}}
 try{await navigator.clipboard.writeText(link);alert('Link copied — now send it to them 💌')}catch(e){prompt('Copy this surprise link:',link)}
}
async function shareAnswer(){
 const link=window.finalAnswerLink||document.getElementById('answerLink')?.value||'';
 if(navigator.share){try{await navigator.share({title:'Your answer ❤️',text:'I answered your little question 💗',url:link});return}catch(e){}}
 try{await navigator.clipboard.writeText(link);alert('Link copied — now send it back to them 💗')}catch(e){prompt('Copy this answer link:',link)}
}
function resize(file,max){return new Promise(r=>{let im=new Image(),c=document.createElement('canvas'),x=URL.createObjectURL(file);im.onload=()=>{let q=Math.min(1,max/im.width,max/im.height);c.width=im.width*q;c.height=im.height*q;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72));URL.revokeObjectURL(x)};im.src=x})}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function goBackFromFinal(){
  if(typeof step==='function'){
    try{ step(8); return; }catch(e){}
  }
  if(typeof currentStep!=='undefined' && typeof renderStep==='function'){
    try{ currentStep=8; renderStep(); return; }catch(e){}
  }
  history.back();
}


</script>
</body></html>
